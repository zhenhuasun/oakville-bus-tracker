<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5cab">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Oakville Bus — Next Bus</title>
<style>
  :root { --ink:#111; --muted:#555; --line:#ddd; --green:#1a7a2e; --blue:#0b5cab; --bg:#fff; --soft:#f2f2f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  /* No horizontal movement (2026-10-29, user requirement): the page must
     never scroll, pan or bounce left-right on a phone, in any view.
     overflow-x:clip on BOTH html and body — clip creates no scroll
     container, so the sticky topbar keeps working; the hidden line is
     only the fallback for browsers without clip support. Vertical
     scrolling, pull behaviour and zoom are untouched (no touch-action
     change, no viewport scaling change). */
  html, body { overflow-x:hidden; overflow-x:clip; }
  .homebar button, .destgrid button { min-width:0; }
  [dir="rtl"] body { text-align:right; }
  header { padding:14px 16px 4px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .homebar button { font-size:19px; padding:12px 16px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; }
  .homebar button.on { background:var(--ink); color:#fff; }
  .section { padding:10px 16px; }
  .section h2 { font-size:20px; margin:6px 0 10px; }
  .homebar, .destgrid { display:flex; flex-wrap:wrap; gap:10px; }
  /* P0: symmetric origin/destination navigation. Two big fields, stacked
     origin above destination with a big Swap button between them, so the
     layout mirrors correctly in Arabic RTL (column order is unchanged by
     dir; only text alignment and the swap arrow flip). */
  .navfields { display:flex; flex-direction:column; gap:12px; }
  .navfield { display:block; width:100%; font-size:26px; line-height:1.3; padding:18px 14px; border:3px solid var(--ink); border-radius:16px; background:#fff; cursor:pointer; text-align:left; }
  .navfield .fldlabel { display:block; font-size:18px; color:var(--muted); font-weight:700; }
  .navfield .fldvalue { display:block; font-size:26px; font-weight:800; }
  [dir="rtl"] .navfield { text-align:right; }
  .swapbtn { display:block; width:100%; font-size:26px; font-weight:800; line-height:1.3; padding:16px 14px; border:3px solid var(--blue); border-radius:16px; background:#e8f3ff; cursor:pointer; }
  .swapbtn:disabled { opacity:.45; cursor:not-allowed; }
  .destgrid button { flex:1 1 44%; font-size:21px; line-height:1.25; padding:16px 12px; border:2px solid var(--ink); border-radius:14px; background:#fff; cursor:pointer; text-align:left; }
  .destgrid button.on { background:#e8f3ff; border-color:var(--blue); }
  .destgrid button:disabled { opacity:.45; cursor:not-allowed; }
  .destgrid .cat { display:block; font-size:15px; color:var(--muted); margin-top:4px; }
  .card { margin:12px 16px; border:3px solid var(--ink); border-radius:16px; padding:16px; }
  .countdown { font-size:clamp(72px,20vw,128px); font-weight:800; line-height:1; margin:4px 0; }
  .countdown small { font-size:26px; font-weight:600; }
  #countdownLabel { font-size:20px; font-weight:700; color:var(--muted); }
  .strip-dot.bus { transition:left 1.2s ease, opacity 1s ease; }
  .strip-dot.bus.arrived { opacity:0; }
  /* Strip redesign (2026-10-29): ONE flex column row ABOVE the track.
     Each column = station name (wraps at spaces, never mid-word) + time
     line(s). Collision fixes 2026-10-29: columns clip overflow at their
     edge instead of spilling into neighbours, carry 3px side padding
     so adjacent columns' texts never touch, and strip names are
     shortened (stripStopName) — timeline, map, search and
     saved-place names keep the full name. The zone below the track
     holds only the transfer branches (step B) — no station names or
     times live there. */
  .strip-cols { display:flex; align-items:flex-end; justify-content:space-between; gap:4px; margin:0 8px 8px; }
  .strip-col { flex:1; min-width:0; overflow:hidden; text-align:center; line-height:1.3; padding:0 3px; }
  .strip-col .sc-name { font-size:14px; font-weight:700; overflow-wrap:normal; word-break:keep-all; }
  .strip-col .sc-time { font-size:14px; font-weight:700; }
  /* Weighted-column strip (2026-10-29): font scales with column count so
     long station names fit narrow columns. 15/14/13px for 3/4/5
     columns; 11px for 6 AND 7 columns (second collision fix
     2026-10-29: a 6-column strip still collided at 12px on a real
     phone). Names break only at spaces (keep-all); a single word
     longer than its column is clipped at the column edge
     (overflow hidden on .strip-col above) instead of spilling into
     the neighbour column. Time lines wrap at spaces, so they stay
     fully visible. */
  .strip-cols.cols-3 .sc-name, .strip-cols.cols-3 .sc-time { font-size:15px; }
  .strip-cols.cols-4 .sc-name, .strip-cols.cols-4 .sc-time { font-size:14px; }
  .strip-cols.cols-5 .sc-name, .strip-cols.cols-5 .sc-time { font-size:13px; }
  .strip-cols.cols-6 .sc-name, .strip-cols.cols-6 .sc-time { font-size:11px; }
  .strip-cols.cols-7 .sc-name, .strip-cols.cols-7 .sc-time { font-size:11px; }
  .strip-branches { position:relative; height:64px; margin:2px 8px 0; z-index:1; }
  .strip-branches svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:0; }
  .strip-branches .approach-svg { position:absolute; top:0; left:0; width:100%; height:64px; overflow:visible; }
  .branch-label { position:absolute; transform:translate(-50%,-50%); font-size:14px; color:var(--muted); white-space:nowrap; background:#fff; padding:2px 6px; border-radius:8px; z-index:1; }
  /* Below-diagram bus-info row (2026-10-30, mobile fix): per-leg
     "Route N · live/not-live" labels and walk-minutes labels live
     here, stacked one per line BELOW the whole branch diagram, so
     they can never overlap lines, dots, or icons. In-diagram labels
     (and their stagger pass) are gone; the diagram box height is
     just the curve height (64 / 88px). */
  #stripBranchLabels { margin:8px 8px 0; }
  #stripBranchLabels .branch-label { position:static; transform:none; display:block; width:fit-content; max-width:100%; margin:3px auto; white-space:normal; text-align:center; }
  .branch-dot { position:absolute; width:30px; height:30px; border-radius:8px; background:var(--blue); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); transition:left 1.2s ease, top 1.2s ease, opacity 1s ease; z-index:2; }
  .branch-dot svg { width:24px; height:24px; display:block; color:#fff; }
  .branch-dot.approaching { background:#fff; border-style:dashed; border-color:var(--blue); box-shadow:none; }
  .branch-dot.approaching svg { color:var(--blue); opacity:.55; }
  /* Per-leg live trackers (2026-10-30): the WAITING bus icon tile for
     a leg with no live vehicle yet uses exactly the waiting visual
     (white tile, dashed blue border, muted glyph) — never a circle.
     Every bus marker on the strip is this rounded icon tile; the only
     circles are the station dots (green origin, red transfers, black
     destination). */
  .branch-dot.waiting { background:#fff; border-style:dashed; border-color:var(--blue); box-shadow:none; }
  .branch-dot.waiting svg { color:var(--blue); opacity:.55; }
  .branch-dot.arrived { opacity:0; }
  .big { font-size:24px; font-weight:700; line-height:1.35; }
  .mid { font-size:20px; line-height:1.45; }
  .muted { color:var(--muted); font-size:18px; line-height:1.45; }
  .pill { display:inline-block; border:2px solid var(--ink); border-radius:999px; padding:4px 12px; font-size:18px; font-weight:700; margin:4px 6px 4px 0; }
  .pill.live { background:#e6f4ea; border-color:var(--green); color:var(--green); }
  .pill.sched { background:#fff3cd; border-color:#8a6d00; }
  .returnbtn { width:100%; font-size:22px; padding:16px; border:3px solid var(--blue); border-radius:14px; background:#e8f3ff; cursor:pointer; margin-top:12px; }
  .returnbtn:disabled { opacity:.45; cursor:not-allowed; }
  /* Simplified route strip: three points only, no map, no pan/zoom/search. */
  .strip { margin-top:18px; padding-top:14px; border-top:2px solid var(--line); }
  .strip-track { position:relative; height:8px; background:transparent; border-radius:4px; margin:26px 8px 10px; z-index:2; }
  /* Segmented main track (2026-10-30, user change): the track is no
     longer one full-width bar — renderStripTrack paints solid rects
     for bus intervals and a zigzag (never a straight line) for walk
     intervals into this svg, centered on the track (24px tall, track
     band y=8..16, center y=12). Stacking: lines (z 0) < passed
     overlays (z 1) < station dots (z 2) < bus icon tiles (z 3); the
     whole track subtree (z 2) paints above the branch box (z 1) so a
     station dot always covers a branch line passing beneath it. */
  .strip-tracksegs { position:absolute; left:0; top:-8px; width:100%; height:24px; overflow:visible; z-index:0; pointer-events:none; }
  /* Per-leg live trackers (2026-10-30): the passed portion of a leg
     renders as a dashed light-grey overlay on the main track (the
     track itself was darkened from #ddd to #bbb so the lighter dashes
     read against it). Dots always paint above it (inserted first). */
  .strip-passed { position:absolute; top:0; height:8px; border-radius:4px; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(90deg, #c8c8c8 0 6px, transparent 6px 12px); }
  .strip-dot { position:absolute; top:50%; width:26px; height:26px; border-radius:50%; transform:translate(-50%,-50%); border:3px solid var(--ink); background:#fff; z-index:2; }
  .strip-dot.bus { width:32px; height:32px; border-radius:9px; background:var(--blue); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:3; }
  .strip-dot.bus svg { width:26px; height:26px; display:block; color:#fff; }
  .strip-dot.bus.dashed { background:#fff; border-style:dashed; border-color:var(--blue); box-shadow:none; }
  .strip-dot.bus.dashed svg { color:var(--blue); opacity:.55; }
  .strip-dot.wait { background:var(--green); }
  .strip-dot.dest { background:#fff; border-width:4px; }
  .strip-dot.transfer { background:#fff; border-width:4px; border-color:#b00; }

  .alert { margin:12px 16px; border:2px solid #8a6d00; border-radius:12px; padding:14px; background:#fff8e1; font-size:19px; line-height:1.45; }
  footer { padding:14px 16px 28px; font-size:15px; color:var(--muted); line-height:1.5; border-top:2px solid var(--line); margin-top:16px; }
  footer p { margin:0 0 12px; }
  footer p:last-child { margin-bottom:0; }
  /* Buy Me a Coffee footer container (2026-10-30 fix): the official
     button renders here via its parser-inserted script tag; centered
     like a final footer line, below the 4 paragraphs. */
  .bmc-footer { padding:0 16px 28px; text-align:center; }
  .warn { color:#a00; font-weight:700; }
  /* Stage 1: fixed top bar with the single language button, overlays, saved places, search, location. */
  /* Unified header 2026-10-29: one bar on every view. Grid 1fr/auto/1fr
     so the title stays truly centered whether or not a back button is
     shown. Overlays sit BELOW the bar (z-index 50 < 60) with top padding
     for the bar height, so the bar is never covered by a sub-view.
     Header direction is fixed LTR: the positions (back far left,
     title centered, language far right) are spatial and must not
     mirror in RTL languages. Original form (restored 2026-10-29, user
     decision): the bar holds ONLY the centered title and the language
     button, plus a back button on sub-views. No coffee cup, no weather
     in the bar — the Buy Me a Coffee button lives in the footer. */
  .topbar { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; position:sticky; top:0; background:#fff; z-index:60; padding:12px 16px 8px; border-bottom:2px solid var(--line); direction:ltr; }
  .topbar h1 { margin:0; white-space:nowrap; }
  .topbar-left { display:flex; align-items:center; min-width:0; }
  .topbar-right { display:flex; align-items:center; min-width:0; }
  .topbar-right .langbtn { margin-left:auto; }
  .headerback { font-size:19px; font-weight:700; padding:10px 12px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; flex:none; white-space:nowrap; }
  /* Narrow guard (kept, simplified): with only title + button the bar
     fits phones easily, but the grid's 1fr side cells each get only
     (viewport - title - padding - gaps) / 2, so at phone widths the
     title drops and the button tightens. 2026-10-30 fix (user report:
     long translated titles/back labels pushed the language button off
     screen): the language button is tightened at every breakpoint
     (desktop 28px -> 24px, <=640px 26px -> 22px, <=360px 24px -> 20px;
     padding 10px 18px -> 6px 10px, border 3px -> 2px, radius 14px ->
     12px) and the back button's text label is hidden at <=640px
     (arrow only, full label kept in aria-label), so phone widths never
     depend on translated back-label length. Touch height stays >= 40px
     (20px font + 12px padding + 4px border = 40px at <=360px).
     Budget with the LONGEST translated title ("Autobus d'Oakville",
     19 chars) and back shown (arrow only): at 390px, title 22px ~230 +
     left ~38 + right ~60 + padding 24 + gaps 12 = ~364 < 390, each side
     under its ~66px share; at 360px, title 20px ~209 + left ~34 +
     right ~56 + padding 24 + gaps 12 = ~335 < 360, each side under its
     ~58px share. Factors: Latin bold 0.55em/char, CJK 1.0em. */
  @media (max-width:640px) {
    .topbar { padding:10px 12px 6px; gap:6px; }
    .topbar h1 { font-size:22px; }
    .langbtn { font-size:22px; padding:6px 10px; }
    .headerback { padding:8px 12px; }
    .headerback-label { display:none; }
  }
  @media (max-width:360px) {
    .topbar { padding:10px 12px 6px; gap:6px; }
    .topbar h1 { font-size:20px; }
    .langbtn { font-size:20px; padding:6px 10px; }
    .headerback { padding:8px 10px; }
    .headerback-label { display:none; }
  }
  .langbtn { font-size:24px; font-weight:800; padding:6px 10px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; flex:none; margin-left:auto; }
  .overlay { position:fixed; inset:0; background:#fff; z-index:50; overflow-y:auto; overflow-x:clip; padding:76px 16px 40px; }
  .overlay h1 { font-size:30px; line-height:1.3; }
  .overlay h2 { font-size:24px; }
  .onboardbtn { display:block; width:100%; font-size:26px; line-height:1.3; padding:18px 14px; margin:10px 0; border:3px solid var(--ink); border-radius:16px; background:#fff; cursor:pointer; text-align:left; }
  .onboardbtn .ex { display:block; font-size:19px; color:var(--muted); margin-top:4px; }
  .biginput { width:100%; font-size:24px; padding:16px; border:3px solid var(--ink); border-radius:14px; margin:8px 0 14px; }
  .result { border:2px solid var(--ink); border-radius:14px; padding:12px; margin:10px 0; }
  .result button.main { display:block; width:100%; font-size:22px; line-height:1.3; padding:14px 10px; border:0; background:#fff; cursor:pointer; text-align:left; }
  .result .sub { font-size:16px; color:var(--muted); line-height:1.4; margin-top:4px; }
  .smallbtn { font-size:19px; padding:10px 14px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; margin:6px 8px 0 0; }
  .smallbtn.danger { border-color:#a00; color:#a00; }
  /* Sort toggle (2026-10-29): four big buttons on the journey board, above
     the alternative options — never hidden behind an icon-only menu, and
     never inside the time picker. Selected mode is dark, like .homebar .on. */
  .sortrow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0 4px; }
  .sortrow .sortlabel { font-size:19px; font-weight:700; }
  .sortbtn { font-size:19px; font-weight:700; padding:12px 16px; border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; }
  .sortbtn[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .savedcard { border:2px solid var(--ink); border-radius:14px; padding:12px; margin:10px 0; }
  .savedcard .name { font-size:23px; font-weight:700; line-height:1.3; }
  .savedcard .sub { font-size:16px; color:var(--muted); line-height:1.4; margin-top:4px; }
  /* Stage 3: trip-only map. The map is an overlay like the other screens:
     it never resizes or covers the board countdown underneath it. */
  #mapCanvas { height:62vh; border:3px solid var(--ink); border-radius:14px; margin:12px 0; background:#eef3ee; }
  .mapcontrols { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .mapcontrols button { font-size:22px; padding:14px 18px; border:3px solid var(--ink); border-radius:14px; background:#fff; cursor:pointer; }
  .mapzoom { display:flex; border:3px solid var(--ink); border-radius:14px; overflow:hidden; }
  .mapzoom button { border:0; border-radius:0; font-size:26px; font-weight:800; padding:14px 22px; }
  .mapzoom button + button { border-left:3px solid var(--ink); }
  [dir="rtl"] .mapcontrols { flex-direction:row-reverse; }
  [dir="rtl"] .mapzoom button + button { border-left:0; border-right:3px solid var(--ink); }
  .map-marker { font-size:20px; font-weight:700; line-height:1.3; background:#fff; border:3px solid var(--ink); border-radius:12px; padding:6px 10px; white-space:nowrap; }
  .map-marker.transfer { border-color:#b00; }
  .map-marker.live { border-color:var(--green); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-left"><button id="headerBack" class="headerback" hidden><span aria-hidden="true">← </span><span id="headerBackLabel" class="headerback-label"></span></button></div>
  <h1 id="title">Oakville Bus</h1>
  <div class="topbar-right"><button id="langBtn" class="langbtn" aria-label="Change language">A文</button></div>
</header>

<!-- P0 navigation (P0b: quick-fill removed 2026-10-28, user decision):
     two symmetric fields (Origin / Destination) and a big Swap button
     between them. Saved places are the shortcut mechanism; there is no
     common-trips quick-fill row. The result board below this section is
     the single journey board (countdown first, inside the card). -->
<div class="section" id="navSection">
  <h2 id="navTitle"></h2>
  <div class="navfields">
    <button id="originField" class="navfield"></button>
    <button id="swapBtn" class="swapbtn"></button>
    <button id="destField" class="navfield"></button>
  </div>
  <div class="homebar" style="margin-top:12px;">
    <button id="timeBtn" class="smallbtn"></button>
  </div>
  <div id="timePanel" hidden>
    <p class="mid" id="timeTitle"></p>
    <div class="homebar">
      <button class="smallbtn" id="timeModeNow"></button>
      <button class="smallbtn" id="timeModeDepart"></button>
      <button class="smallbtn" id="timeModeArrive"></button>
    </div>
    <div id="timeInputs">
      <input class="biginput" id="timeDate" type="date">
      <input class="biginput" id="timeClock" type="time">
    </div>
    <p class="muted" id="timeNote"></p>
  </div>
</div>

<div class="section" id="savedSection">
  <h2 id="savedLabel">Saved places</h2>
  <div id="savedgrid"></div>
  <p class="muted" id="savedNote"></p>
</div>

<div class="section">
  <div class="homebar">
    <button id="searchBtn"></button>
    <button id="locationBtn"></button>
    <button id="pickMapBtn"></button>
  </div>
</div>

<div class="card" id="board" aria-live="polite">
  <div class="muted" id="boardMode"></div>
  <div id="countdownLabel"></div>
  <div class="countdown" id="countdown">—</div>
  <div class="big" id="routeLine"></div>
  <div class="mid" id="waitLine"></div>
  <div class="mid" id="busLine"></div>
  <div class="mid" id="nextLine"></div>
  <div id="pills"></div>
  <div class="strip" id="strip" hidden>
    <div class="strip-cols" id="stripCols"></div>
    <div class="strip-track">
      <span class="strip-dot bus" id="stripBus" title=""><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 4h16a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm1 4h6v6H9Zm8 0h6v6h-6Z"/><circle cx="11" cy="26" r="3" fill="currentColor"/><circle cx="21" cy="26" r="3" fill="currentColor"/></svg></span>
      <span class="strip-dot wait" id="stripWait" title=""></span>
      <span class="strip-dot transfer" id="stripTransfer" title="" hidden></span>
      <span class="strip-dot dest" id="stripDest" title=""></span>
    </div>
    <div class="strip-branches" id="stripBranches"></div>
    <div id="stripBranchLabels"></div>
    <div class="muted" id="stripLegs" style="text-align:center;margin-top:6px;"></div>
  </div>
  <button class="returnbtn" id="mapBtn" hidden></button>
  <div id="sortRow" class="sortrow" hidden></div>
  <div id="journeyAlts"></div>
</div>

<div id="alerts"></div>

<footer id="footer"></footer>

<!-- Buy Me a Coffee button (user-supplied official tag, 2026-10-30 fix):
     parser-inserted HERE, in its own container AFTER the JS-rendered
     footer paragraphs. The previous implementation appended this script
     as a live DOM node from renderFooter(), which can never render:
     the loader renders via document.writeln(), which only works for a
     parser-inserted script tag during page load. This container is
     NEVER touched by renderFooter() (it resets only #footer innerHTML),
     so the button survives language switches and re-renders. -->
<div id="bmcFooter" class="bmc-footer"><script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="joshuasun" data-color="#5F7FFF" data-emoji="" data-font="Poppins" data-text="Buy me a coffee" data-outline-color="#000000" data-font-color="#ffffff" data-coffee-color="#FFDD00"></script></div>

<!-- Stage 1 overlays: onboarding, search, location. The main screen stays
     in the DOM underneath, so opening any overlay never loses the trip. -->
<div id="onboarding" class="overlay" hidden>
  <h1 id="onbTitle"></h1>
  <div id="onbButtons"></div>
  <p class="muted" id="onbDraft"></p>
</div>

<div id="searchScreen" class="overlay" hidden>
  <h2 id="searchTitle"></h2>
  <!-- Search/time fix 2026-10-29: results sit DIRECTLY below the input.
       The category note + buttons used to sit between input and results,
       pushing results off-screen so typing looked dead. Order now:
       input, results, category buttons, saved list. -->
  <input class="biginput" id="searchInput" type="search" autocomplete="off" autocapitalize="off">
  <div id="searchResults"></div>
  <p class="muted" id="searchCatNote"></p>
  <div id="searchCats" class="homebar"></div>
  <h2 id="searchSavedLabel"></h2>
  <div id="searchSaved"></div>

// ---------------------------------------------------------------------------
// Toronto time + active services (calendar.txt + calendar_dates.txt).
// ---------------------------------------------------------------------------
function torontoParts(date) {
  const fmt = new Intl.DateTimeFormat("en-CA", { timeZone:"America/Toronto",
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false, weekday:"short" });
  const parts = {};
  for (const p of fmt.formatToParts(date)) parts[p.type] = p.value;
  const wdMap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  return { dateStr: parts.year + parts.month + parts.day,
           display: parts.year + "-" + parts.month + "-" + parts.day,
           minutes: (parseInt(parts.hour,10) % 24) * 60 + parseInt(parts.minute,10),
           weekday: wdMap[parts.weekday] };
}
function activeServices(meta, dateStr, weekday) {
  const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const active = new Set();
  for (const s of meta.services) {
    if (s.start_date <= dateStr && dateStr <= s.end_date && s[days[weekday]] === "1") active.add(s.service_id);
  }
  for (const ex of meta.calendar_dates || []) {
    if (ex.date !== dateStr) continue;
    if (ex.exception_type === "1") active.add(ex.service_id);
    if (ex.exception_type === "2") active.delete(ex.service_id);
  }
  return active;
}
function fmtTime(minutes) {
  const m = ((Math.floor(minutes) % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60), mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}

async function loadRT() {

function nextDepartures(deps, now, boardStopId) {
  if (boardStopId) deps = deps.filter(d => d.origin_stop === boardStopId);
  // Returns the next two departures, scanning 7 days ahead so a pair whose
  // service does not run today (e.g. weekday-only) still shows its next bus
  // with a date, instead of wrongly claiming "no more buses".
  // Each entry: {dep, day, dayDate, live, minutesAway}.
  // NOTE: dep.origin_stop is the boarding stop for that direction's list:
  // the home terminal for "out" departures, the destination place's stop
  // for "back" (return) departures. The RT stop match below uses it as-is.
  const today = torontoParts(now);
  const cands = [];
  for (let d = 0; d < 7; d++) {
    const day = torontoParts(new Date(now.getTime() + d * 86400000));
    const svc = activeServices(DATA.meta, day.dateStr, day.weekday);
    for (const dep of deps) {
      if (svc.has(dep.service_id)) {
        cands.push({ dep, day: d, dayDate: day.display, abs: dep.departure_minutes + d * 1440 });
      }
    }
  }
  cands.sort((a, b) => a.abs - b.abs);
  const upcoming = cands.filter(c => c.abs >= today.minutes - 1);
  return upcoming.slice(0, 2).map(c => {
    const tu = RT.trips.get(c.dep.original_trip_id + "|" + c.dep.route_id);
    let live = false, minutesAway = Math.round(c.abs - today.minutes);
    if (tu) {
      const stu = tu.stops.find(s => s.stop_id === c.dep.origin_stop);
      if (stu && stu.time) {
        live = true;
        minutesAway = Math.round((stu.time * 1000 - Date.now()) / 60000);
      }
    }
    return { dep: c.dep, day: c.day, dayDate: c.dayDate, live, minutesAway };
  });
}

  document.getElementById("locGo").textContent = t("locationBtn");

function useLocation() {
  const status = document.getElementById("locStatus");

  results.innerHTML = "";
  if (!navigator.geolocation) { status.textContent = t("geoUnsupported"); return; }
  status.textContent = t("locSearching");
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      // P0b: My location returns a STREET ADDRESS, not a stop list.
      // Reverse-geocoded via Nominatim (see the P0b block); on failure
      // the row shows a coordinates label and says so — never a
      // guessed address. The nearest stop is used internally and its
      // true walking distance is shown (longWalk pattern when >400 m).
      const res = await addressEndpointForCoords(pos.coords.latitude, pos.coords.longitude);
      const ep = res.endpoint;
      results.innerHTML = "";
      status.textContent = res.detected ? t("locAddressFound") : t("locAddressFailed");
      const row = document.createElement("div"); row.className = "result";
      const main = document.createElement("button"); main.className = "main";
      main.textContent = ep.label;
      main.onclick = () => { document.getElementById("locationScreen").hidden = true; setNavEndpoint("origin", ep); };
      const sub = document.createElement("div"); sub.className = "sub";
      const near = ep.stopId ? stopById(ep.stopId) : null;
      const lrw = (near && ep.lat !== undefined && ep.lat !== null)
        ? resolveWalk([ep.lat, ep.lon], [near.lat, near.lon]) : null;
      const ldist = lrw ? lrw.m : ep.nearestDist;
      const lsub = (m) => near
        ? near.name + " (" + t("stopCode") + " " + near.code + ") · " + m + " " + t("mAway") +
          (m > 400 ? " · " + t("longWalkLabel").replace("{m}", String(m)) : "")
        : t("locNoStops");
      sub.textContent = lsub(ldist);
      if (lrw && lrw.source !== "street" && near) upgradeWalkEl(sub, [ep.lat, ep.lon], [near.lat, near.lon], lsub);
      const save = document.createElement("button"); save.className = "smallbtn"; save.textContent = "＋ " + t("addSaved");
      save.onclick = () => { addSavedPlace({ key: "address:" + ep.lat.toFixed(5) + "," + ep.lon.toFixed(5), custom: ep.label, kind: "address", destId: null, stopId: ep.stopId, stopName: near ? near.name : null, stopCode: near ? near.code : null, address: ep.address, enName: ep.label, lat: ep.lat, lon: ep.lon, nearestDist: ep.nearestDist }); renderSaved(); };
      row.appendChild(main); row.appendChild(sub); row.appendChild(save);

function applyStopAsOrigin(stop) {

  // fills the origin field only; the destination field is untouched,
  // except a destination's candidate stop, which — as before — means
  // the return trip toward the home terminal).
  const scr = document.getElementById("locationScreen"); if (scr) scr.hidden = true;
  const o = originByStopId(stop.id);
  if (o) { setNavEndpoint("origin", endpointFromOriginTerm(o)); return true; }
  const d = destByCandidateStop(stop.id);
  if (d) {
    const order = DATA.origins.slice().sort((a, b) => (a.id === home ? -1 : b.id === home ? 1 : 0));
    const oo = order[0];
    if (oo) {
      const ok = (typeof setNavPair === "function") ? setNavPair(endpointFromStop(stop), endpointFromOriginTerm(oo)) : false;

}

        d += " L " + x + " " + (up ? (12 - WALK_TOOTH_AMP_PX) : (12 + WALK_TOOTH_AMP_PX));
        up = !up;
        teeth++;
      }

      // as a straight line — forbidden for walks. Guarantee at least
      // one tooth at the midpoint.
      if (teeth === 0) d += " L " + ((a + b) * 5) + " " + (12 - WALK_TOOTH_AMP_PX);
      d += " L " + (b * 10) + " 12";
      path._trackSeg = { kind: "walk", fromPct: a, toPct: b, stepUnits: WALK_TOOTH_STEP_UNITS, amplitude: WALK_TOOTH_AMP_PX, strokeWidth: TRACK_THICKNESS_PX, zigzag: true, teeth: teeth === 0 ? 1 : teeth };
      path._walkConnector = { transfer: w.transfer, fromPct: a, toPct: b, walkM: w.walkM, walkMin: w.walkMin, zigzag: true };
      try {
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#bbb");
        path.setAttribute("stroke-width", String(TRACK_THICKNESS_PX));
        path.setAttribute("vector-effect", "non-scaling-stroke");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("opacity", "1");

    } else if (fin) {

      try {
        path.setAttribute("d", "M " + (a * 10) + " 12 L " + (b * 10) + " 12");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#c8c8c8");
        path.setAttribute("stroke-width", String(TRACK_THICKNESS_PX));
        path.setAttribute("vector-effect", "non-scaling-stroke");
        path.setAttribute("stroke-dasharray", "6 6");
        path.setAttribute("opacity", "1");
      } catch (e) {}
      try { svg.appendChild(path); } catch (e) {}
    } else {
      const r = mkSvgEl("rect");

        r.setAttribute("y", "8");

        r.setAttribute("fill", "#bbb");

      try { svg.appendChild(r); } catch (e) {}
    }
  }
  try {
    if (track.insertBefore && track.firstChild) track.insertBefore(svg, track.firstChild);
    else if (track.appendChild) track.appendChild(svg);
  } catch (e) {}
  return svg;
}

let mainLineLegExtras = [];
// Diagram-confirmed merged-phase icons (2026-10-30): a transfer leg
// whose bus has merged travels ON THE MAIN LINE, so its icon tile
// lives on the track (not in the branch box). One tile per merged
// leg at board + mainFrac * (alight - board), plus a dashed
// light-grey passed overlay for board -> vehicle. Spans are recreated
// every render and cleaned via mainLineLegExtras (same guarded pattern

// Overlays are inserted FIRST in the track so station dots and icon

// main segment is dashed by renderStripTrack's finished intervals,
// and a second dashed overlay on top would double the pattern.
function renderMainLineLegIcons(opt, anchors, branchStates, isTodayJourney) {
  try {
    for (const d of mainLineLegExtras) {
      if (d && d.parentNode && d.parentNode.removeChild) d.parentNode.removeChild(d);
      else if (d && d.remove) d.remove();
    }
  } catch (e) {}
  mainLineLegExtras = [];
  if (!opt || !branchStates || !branchStates.length) return;
  let track = null;
  try { const bd = document.getElementById("stripBus"); track = bd ? bd.parentNode : null; } catch (e) {}
  if (!track || !track.appendChild) return;
  const rtl = document.documentElement && document.documentElement.dir === "rtl";
  const pos = (ltrPct) => (rtl ? (100 - ltrPct) : ltrPct) + "%";
  const addOverlay = (fromDisp, toDisp, st) => {
    if (Math.abs(toDisp - fromDisp) <= 0.5) return;
    const ov = document.createElement("div");
    ov.className = "strip-passed";
    ov.style.left = Math.min(fromDisp, toDisp) + "%";
    ov.style.width = Math.abs(toDisp - fromDisp) + "%";
    ov._stripPassedLi = { li: st.li, route: st.route, fromPct: Math.min(fromDisp, toDisp), toPct: Math.max(fromDisp, toDisp) };
    if (track.insertBefore && track.firstChild) track.insertBefore(ov, track.firstChild);

  for (const st of branchStates) {
    if (st.mode !== "merged") continue;
    if (st.mergePct == null || st.alightPct == null || !(st.alightPct > st.mergePct)) continue;
    {
      const mainPct = st.mergePct + (st.alightPct - st.mergePct) * Math.max(0, Math.min(1, st.mainFrac));
      const dot = document.createElement("span");

      dot.innerHTML = STRIP_BUS_ICON_SVG;
      dot.style.left = pos(mainPct);
      dot._mainLineDot = { li: st.li, route: st.route, mode: "merged", frac: st.mainFrac, pct: mainPct };
      track.appendChild(dot);
      mainLineLegExtras.push(dot);
      addOverlay(stripPosNum(st.mergePct), stripPosNum(mainPct), st);
    }
  }
}

// Strip v3: leg-1 dot decision, extracted from renderJourneyBoard so

//   "none"    -- not today, or no live vehicle and leg not finished:
//                dashed bus-column icon at the strip start (as before).
//   "moving"  -- live vehicle approaching or on the leg (a late bus
//                whose scheduled alighting time passed still moves:
//                live evidence wins over schedule).
//   "arrived" -- finished: live-arrived, or timetable-finished with no
//                live vehicle. The caller hides the bus-column icon
//                entirely (hidden + arrived class + opacity 0); the

function leg1DotState(leg1, anchors, isTodayJourney, timeToday, nowMin) {

  const fi = legFinishedInfo(leg1, isTodayJourney, nowMin, timeToday);
  const prog1 = fi.prog;

  if (!prog1) return { mode: "none", pct: anchors.start };

  if (raw.direction === "out" || raw.direction === "back") direction = raw.direction;
  syncLegacyFromNav();
  lastLegacySig = legacySig();
  return runNavSearch();
}

async function init() {
  try {
    const res = await fetch("pairs.json");
    DATA = await res.json();
  } catch (e) {
    document.getElementById("routeLine").textContent = "Could not load timetable data (pairs.json). Run with wrangler dev — see README.md.";
    return;
  }
  try { const sres = await fetch("stops.json"); STOPS = await sres.json(); } catch (e) { STOPS = null; }
  try { const tres = await fetch("timetable.json"); const td = await tres.json(); TT = (td && Array.isArray(td.trips)) ? td : null; } catch (e) { TT = null; }
  try { const pres = await fetch("places.json"); const pd = await pres.json(); PLACES = (pd && Array.isArray(pd.places)) ? pd : null; } catch (e) { PLACES = null; }
  if (!DATA.origins.some(o => o.id === home)) home = DATA.origins[0].id;
  // Homefix 2026-10-29 (user decision: DEFAULT EMPTY, reversing the old
  // restore behaviour): on load, Origin and Destination are EMPTY.
  // The previous trip in obt_nav is NOT restored, and the fields are
  // NOT derived from the legacy home/dest pair on init. Picking fields,
  // swap, and within-session persistence still work; a reload
  // intentionally starts empty again. restoreNavFromStorage() is kept
  // only as a harness helper, not called here.
  navOrigin = null; navDest = null; journeyState = null;
  // Baseline the legacy signature so render()'s syncNavJourney cannot
  // re-derive the fields from the legacy pair on first load. A later
  // legacy edit (test setTrip hook) still changes the signature and
  // can derive, as before.
  try { lastLegacySig = legacySig(); } catch (e) {}
  await loadRT();
  render();
  // Stage 1 onboarding: anyone without a stored language sees it once,
  // including users who visited before Stage 1. The main screen (and the
  // trip) is already rendered behind the overlay.
  if (!langStored) showOnboarding();
  setInterval(async () => { await loadRT(); renderBoard(); renderAlerts(); }, 30000);
}
init();
</script>
</body>
</html>
